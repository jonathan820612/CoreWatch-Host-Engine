[package]
name = "corewatch-rust"
version = "0.1.0"
edition = "2024"
default-run = "RustCoreWatch"

[[bin]]
name = "RustCoreWatch"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.39"
tauri = { version = "2", features = ["tray-icon"] }
tempfile = "3"
wmi = "0.18"
winreg = "0.56"
windows = { version = "0.62", features = ["ApplicationModel", "Devices_Enumeration", "Devices_Lights", "Foundation_Collections", "Management_Deployment", "UI", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Shell_Common", "Win32_System_Variant", "Win32_NetworkManagement_WindowsFirewall"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Devices_Display", "Win32_Devices_HumanInterfaceDevice", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Environment", "Win32_System_Threading", "Win32_Security", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Networking_WinHttp", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_UI_Shell", "Win32_System_EventLog", "Win32_System_Time", "Win32_System_Diagnostics_Debug", "Win32_NetworkManagement_WiFi", "Win32_UI_HiDpi", "Win32_UI_ColorSystem", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_NetworkManagement_Dns", "Win32_System_Services", "Win32_System_Performance"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
